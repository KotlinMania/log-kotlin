org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g
kotlin.daemon.jvmargs=-Xmx8g

# Match Kotlin/Native compiler-backend codegen parallelism to the host's
# processor count. Default is 4 hard-coded threads, which fires a
# "The number of threads 4 is more than the number of processors N"
# warning on hosts with fewer than 4 cores — notably the macos-latest
# free-tier runner with 3 vCPUs. 0 = "one thread per processor core",
# which adapts to whatever machine builds. This is the property the
# Kotlin Gradle plugin honors (kotlin-gradle-plugin internally maps
# this onto -Xbackend-threads); the equivalent compiler flag via
# freeCompilerArgs conflicts with the plugin's own default and produces
# an "Argument -Xbackend-threads is passed multiple times" warning.
kotlin.native.parallelThreads=0
